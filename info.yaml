# Tiny Tapeout project information: the full chip.
project:
  title:        "TSE: Timed Spec Engine"
  author:       "Sameera Khatoon"
  discord:      ""
  description:  "Write a protocol once as a timed spec; the chip speaks it, checks it and triggers on it"
  language:     "SystemVerilog"
  clock_hz:     60000000

  # Valid tile sizes for CMOS5L are the keys of tt-support-tools tile_sizes.yaml.
  tiles: "8x4"

  # Rename here and in the module line of the top source file only (see test/Makefile).
  top_module:  "tt_um_tse_sk_chip"

  # Source files must be in ./src, one per line. test/Makefile reads this list.
  # Packages first: the modules import them.
  source_files:
    - "tse_isa_pkg.sv"
    - "tse_regs_pkg.sv"
    - "tt_um_tse_sk_chip.sv"
    - "tse_chip.sv"
    - "tse_top.sv"
    - "tse_rst_sync.sv"
    - "tse_loader.sv"
    - "tse_host_spi.sv"
    - "tse_selftest.sv"
    - "tse_prog_mem.sv"
    - "tse_slot_arb.sv"
    - "tse_sram_512x32.sv"
    - "tse_sram_bb.v"
    - "tse_cfg_bank.sv"
    - "tse_lane.sv"
    - "tse_seq.sv"
    - "tse_crc.sv"
    - "tse_stuffer.sv"
    - "tse_codec.sv"
    - "tse_dpll.sv"
    - "tse_resp_rule.sv"
    - "tse_timer.sv"
    - "tse_nco.sv"
    - "tse_xbar.sv"
    - "tse_pin_delay.sv"
    - "tse_event_unit.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# Each name reads: load mode (rst_n low) / run mode (rst_n high).
# LDn = loader data, RBn = loader readback, XINn, XOUTn, XIOn = crossbar pads.
pinout:
  # Inputs
  ui[0]: "LD0 / SPI CS_N or XIN0"
  ui[1]: "LD1 / SPI SCK or XIN1"
  ui[2]: "LD2 / SPI MOSI or XIN2"
  ui[3]: "LD3 / XIN3"
  ui[4]: "LD4 / XIN4"
  ui[5]: "LD5 / XIN5"
  ui[6]: "LD6 / XIN6"
  ui[7]: "LD7 / XIN7"

  # Outputs
  uo[0]: "RB0 / XOUT0"
  uo[1]: "RB1 / XOUT1"
  uo[2]: "RB2 / XOUT2"
  uo[3]: "RB3 / SPI MISO or XOUT3"
  uo[4]: "RB4 / XOUT4"
  uo[5]: "RB5 / XOUT5"
  uo[6]: "RB6 / IRQ or XOUT6"
  uo[7]: "RB7 / TRIG or XOUT7"

  # Bidirectional pins
  uio[0]: "LD strobe / XIO0"
  uio[1]: "LD frame / XIO1"
  uio[2]: "unused / XIO2 (open drain)"
  uio[3]: "unused / XIO3 (open drain)"
  uio[4]: "unused / XIO4 (open drain)"
  uio[5]: "unused / XIO5 (open drain)"
  uio[6]: "unused / XIO6 (open drain)"
  uio[7]: "unused / XIO7 (open drain)"

# Do not change!
yaml_version: 6
