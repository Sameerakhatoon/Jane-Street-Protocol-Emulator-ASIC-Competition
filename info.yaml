# Tiny Tapeout project information
project:
  title:        "TSE: Timed Spec Engine"
  author:       "Sameera Khatoon"
  discord:      ""
  description:  "Write a protocol once as a timed spec; the chip speaks it, checks it and triggers on it"
  language:     "SystemVerilog"
  clock_hz:     60000000

  # Valid tile sizes for CMOS5L are the keys of tt-support-tools tile_sizes.yaml.
  tiles: "6x4"

  # Rename here and in the module line of the top source file only (see test/Makefile).
  top_module:  "tt_um_tse_sk"

  # Source files must be in ./src, one per line. test/Makefile reads this list.
  # The tile builds the UART test design; the full chip's sources are listed in info_chip.yaml.
  source_files:
    - "tt_um_tse_sk.sv"
    - "tse_rst_sync.sv"
    - "tse_sync.sv"
    - "tse_nco.sv"
    - "tse_uart_tx.sv"
    - "tse_uart_rx.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "TX byte bit 0"
  ui[1]: "TX byte bit 1"
  ui[2]: "TX byte bit 2"
  ui[3]: "TX byte bit 3 / UART RX in echo mode"
  ui[4]: "TX byte bit 4"
  ui[5]: "TX byte bit 5"
  ui[6]: "TX byte bit 6"
  ui[7]: "TX byte bit 7"

  # Outputs
  uo[0]: "UART TX"
  uo[1]: "TX busy"
  uo[2]: "RX byte toggle"
  uo[3]: "RX framing error"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "send strobe (rising edge, input)"
  uio[1]: "echo mode (input)"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
