# Tools for the repository's own make targets: one pinned OSS CAD Suite build
# (yosys, iverilog, verilator, sby, mcy), cached as the release archive, and
# the pinned packages of .github/ci-requirements.txt installed for the suite's
# own Python 3.11. The suite's vvp wrapper always runs cocotb in that Python
# (it sets PYTHONHOME and PYTHONEXECUTABLE), so the packages must live there;
# they go in their own folder ahead of the suite's bundled cocotb on PYTHONPATH.
name: setup-tse
description: Install the pinned OSS CAD Suite and Python packages
inputs:
  oss-cad-suite:
    description: OSS CAD Suite release tag (YYYY-MM-DD)
    default: '2026-10-11'
runs:
  using: composite
  steps:
    - name: Archive name
      id: suite
      shell: bash
      env:
        TAG: ${{ inputs.oss-cad-suite }}
      run: |
        name="oss-cad-suite-linux-x64-${TAG//-/}.tgz"
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "url=https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$TAG/$name" >> "$GITHUB_OUTPUT"

    - name: Restore OSS CAD Suite archive
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/oss-cad-suite/${{ steps.suite.outputs.name }}
        key: ${{ steps.suite.outputs.name }}

    - name: Download OSS CAD Suite
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        URL: ${{ steps.suite.outputs.url }}
        NAME: ${{ steps.suite.outputs.name }}
      run: |
        mkdir -p ~/.cache/oss-cad-suite
        curl -fsSL --retry 3 -o ~/.cache/oss-cad-suite/"$NAME" "$URL"

    - name: Unpack OSS CAD Suite
      shell: bash
      env:
        NAME: ${{ steps.suite.outputs.name }}
      run: |
        dir="$RUNNER_TEMP/oss-cad-suite"
        rm -rf "$dir" && mkdir -p "$dir"
        tar -xzf ~/.cache/oss-cad-suite/"$NAME" -C "$dir" --strip-components=1
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "$dir/py3bin" >> "$GITHUB_PATH"

    - name: Python packages
      shell: bash
      run: |
        deps="$RUNNER_TEMP/pydeps"
        "$RUNNER_TEMP/oss-cad-suite/py3bin/python3" -m pip install --quiet --target "$deps" -r .github/ci-requirements.txt
        echo "PYTHONPATH=$deps" >> "$GITHUB_ENV"
        echo "$deps/bin" >> "$GITHUB_PATH"

    - name: Versions
      shell: bash
      run: |
        yosys -V
        { iverilog -V 2>&1 || true; } | sed -n 1p
        verilator --version
        which python3 && python3 --version
        cocotb-config --version
