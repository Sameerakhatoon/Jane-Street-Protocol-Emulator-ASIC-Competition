name: fpga

# Manual only. The UART top builds an ICE40UP5K bitstream; the full-chip top
# does not, because its program memory is the IHP SRAM macro, which has no
# FPGA model.
on:
  workflow_dispatch:

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: FPGA bitstream for TT ASIC Sim (ICE40UP5K)
        uses: TinyTapeout/tt-gds-action/fpga/ice40up5k@ttihp27a
