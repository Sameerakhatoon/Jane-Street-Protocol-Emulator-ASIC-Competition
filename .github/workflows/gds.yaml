name: gds

# One hardening of the 8x4 tile takes hours of runner time, so a push only
# starts it when an input of the flow or of the gate-level test changed, and
# a newer push to the same branch cancels the older run. Run it by hand
# before a submission so the submitted commit has its own GDS.
on:
  push:
    paths:
      - 'src/**'
      - 'info.yaml'
      - 'test/**'
      - '.github/workflows/gds.yaml'
  workflow_dispatch:

concurrency:
  group: gds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  # Needs GitHub Pages (source: GitHub Actions); repository variable
  # TT_VIEWER=off skips it where Pages is not available.
  viewer:
    needs: gds
    if: vars.TT_VIEWER != 'off'
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a
